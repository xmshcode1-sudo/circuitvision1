<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الدروس — CircuitVision</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Readex+Pro:wght@400;600;700&display=swap">
<link rel="stylesheet" href="style.css">
<style>
  .main { min-width: 0; padding-block: 22px 56px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; align-content: start; max-width: 1180px; width: 100%; }
  .crumbs { font-size: 13px; color: var(--fg-3); display: flex; gap: 8px; flex-wrap: wrap; }
  .crumbs a:hover { color: var(--fg); }
  .chaps { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
  .chap { flex: none; display: flex; gap: 8px; align-items: center; padding: 7px 12px; border-radius: 99px; border: 1px solid var(--line-soft); background: var(--surface); font-size: 13.5px; color: var(--fg-2); white-space: nowrap; }
  a.chap:hover { border-color: var(--blue); color: var(--fg); }
  .chap.cur { background: var(--blue); border-color: var(--blue); color: #fff; }
  .chap.off { opacity: .45; }
  .chap .cn { font-family: var(--font-mono); font-size: 12px; }
  .chap .cp { font-family: var(--font-mono); font-size: 11.5px; opacity: .75; }
  .ch-tabs { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; }
  .ch-tab { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 8px; align-items: center; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line-soft); background: var(--surface); font-size: 13.5px; color: var(--fg-2); min-width: 0; }
  .ch-tab .n { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-mono); font-size: 12px; border: 1px solid var(--line); }
  .ch-tab.done .n { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
  .ch-tab.cur { border-color: var(--blue); color: var(--fg); background: var(--blue-soft); }
  .ch-tab span.t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .l-head { display: grid; gap: 6px; padding-top: 4px; }
  .l-head h1 { font-size: clamp(25px, 3.2vw, 34px); }
  .l-head .en { font-family: var(--font-display); color: var(--fg-3); justify-self: start; }
  .l-meta { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--fg-3); }

  .l-grid { display: grid; grid-template-columns: minmax(0, 1fr) 270px; gap: 20px; align-items: start; }
  .l-body { display: grid; gap: 16px; min-width: 0; }
  .l-aside { position: sticky; top: calc(16px + env(safe-area-inset-top, 0px)); display: grid; gap: 12px; }
  .toc { padding: 14px; display: grid; gap: 2px; }
  .toc b { font-family: var(--font-display); font-size: 14px; margin-bottom: 6px; }
  .toc a { font-size: 13.5px; color: var(--fg-2); padding: 5px 8px; border-radius: 7px; }
  .toc a:hover { background: var(--surface-2); color: var(--fg); }
  .req { padding: 14px; display: grid; gap: 10px; }
  .req b { font-family: var(--font-display); font-size: 14px; }
  .req ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 13.5px; }
  .req li { display: flex; gap: 8px; align-items: center; color: var(--fg-2); }
  .req li::before { content: ""; width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--line); flex: none; }
  .req li.ok { color: var(--fg); }
  .req li.ok::before { background: var(--ok); border-color: var(--ok); box-shadow: inset 0 0 0 3px var(--surface); }

  .obj { padding: 16px 18px; }
  .obj b { font-family: var(--font-display); font-size: 15px; }
  .obj ul { margin: 6px 0 0; padding-inline-start: 20px; color: var(--fg-2); }

  .l-sec { padding: 20px 22px; display: grid; gap: 12px; scroll-margin-top: 16px; }
  .l-sec.flash { animation: flash 1.4s ease; }
  @keyframes flash { 0%, 30% { box-shadow: 0 0 0 2px var(--orange); } 100% { box-shadow: none; } }
  .sec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .sec-h h2 { font-size: 19px; }
  .sec-h .en { font-size: 12.5px; color: var(--fg-3); font-family: var(--font-display); }
  .prose { display: grid; gap: 12px; color: var(--fg); max-width: 72ch; }
  .prose p { margin: 0; }
  .callout { padding: 12px 14px; border-radius: 10px; background: var(--blue-soft); border-inline-start: 3px solid var(--blue); }
  .flow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13.5px; }
  .flow span { padding: 6px 10px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line-soft); }
  .flow i { color: var(--orange); font-style: normal; }
  .terms { display: grid; grid-template-columns: minmax(150px, max-content) minmax(0, 1fr); gap: 8px 16px; margin: 0; }
  .terms dt { font-family: var(--font-display); direction: ltr; text-align: right; color: var(--glow); font-size: 14px; }
  .terms dd { margin: 0; color: var(--fg-2); }
  .prefixes { display: flex; flex-wrap: wrap; gap: 8px; }
  .prefixes span { padding: 6px 10px; border-radius: 8px; background: var(--surface-2); font-family: var(--font-mono); font-size: 13px; display: flex; gap: 8px; }
  .prefixes b { color: var(--orange); }
  .ticks { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
  .ticks li { position: relative; padding-inline-start: 22px; }
  .ticks li::before { content: ""; position: absolute; inset-inline-start: 0; top: .6em; width: 9px; height: 5px; border-left: 2px solid var(--ok); border-bottom: 2px solid var(--ok); transform: rotate(-45deg); }
  .q { padding: 12px 14px; border-radius: 10px; background: var(--surface-2); }
  .ex-split { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 16px; align-items: start; }
  .cases { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .cases figure { margin: 0; padding: 10px; border-radius: 10px; background: var(--surface-2); text-align: center; display: grid; gap: 6px; font-size: 13.5px; }
  .lfig { padding: 10px; border-radius: 12px; background: var(--bg-2); border: 1px solid var(--line-soft); overflow-x: auto; }
  .lfig .sc { max-height: 340px; }
  .dg { width: 100%; max-width: 210px; height: auto; direction: ltr; justify-self: center; }
  .dg-w { fill: none; stroke: var(--fg-2); stroke-width: 2.4; }
  .dg-t { fill: var(--bg); stroke: var(--fg-2); stroke-width: 2; }
  .dg-box { fill: var(--surface); stroke: var(--orange); stroke-width: 2.4; }
  .dg-pol { fill: var(--fg); font: 600 22px var(--font-mono); }
  .dg-lbl { fill: var(--fg); font: 500 15px var(--font-mono); }
  .dg-sub { fill: var(--fg-3); font: 12px var(--font-mono); }
  .dg-arrow { fill: var(--glow); }

  /* Video & connected */
  .pending { display: flex; gap: 14px; align-items: center; padding: 14px; border-radius: 10px; border: 1px dashed var(--line); }
  .vids { display: grid; gap: 10px; }
  .pending .ic { width: 42px; height: 42px; border-radius: 10px; display: grid; place-items: center; background: var(--muted-soft); color: var(--fg-3); flex: none; }
  .pending .ic svg { width: 22px; height: 22px; }
  .pending p { font-size: 14px; color: var(--fg-2); }
  .pending b { display: block; color: var(--fg); font-family: var(--font-display); font-size: 15px; }
  .connected { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }

  /* Quiz */
  .qz { display: grid; gap: 10px; padding: 14px; border-radius: 12px; border: 1px solid var(--line-soft); }
  .qz-q { font-weight: 500; }
  .qz-q .n { font-family: var(--font-mono); color: var(--orange); margin-inline-end: 6px; }
  .qz-opts { display: grid; gap: 6px; }
  .qz-opt { text-align: start; padding: 9px 12px; border-radius: 9px; border: 1px solid var(--line); background: transparent; cursor: pointer; }
  .qz-opt:hover:not(:disabled) { border-color: var(--blue); }
  .qz-opt.wrong { border-color: color-mix(in srgb, #ff5a6e 60%, transparent); opacity: .7; }
  .qz-opt.right { border-color: var(--ok); background: var(--ok-soft); }
  .qz-opt:disabled { cursor: default; }
  .qz-fb { font-size: 14px; padding: 10px 12px; border-radius: 9px; display: grid; gap: 4px; }
  .qz-fb.bad { background: color-mix(in srgb, #ff5a6e 9%, var(--surface)); }
  .qz-fb.good { background: var(--ok-soft); }

  .finish { padding: 20px 22px; display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; }
  .finish p { color: var(--fg-2); font-size: 14.5px; }
  .sum { margin: 0; padding: 12px 14px; border-radius: 10px; background: var(--blue-soft); border-inline-start: 3px solid var(--glow); font-size: 15.5px; line-height: 1.75; }
  .sum-l li { font-size: 15px; }
  .more { border-top: 1px dashed var(--line-soft); padding-top: 8px; }
  .more > summary { cursor: pointer; color: var(--glow); font-size: 14px; font-weight: 600; list-style: none; display: inline-flex; gap: 6px; align-items: center; padding: 4px 0; }
  .more > summary::-webkit-details-marker { display: none; }
  .more > summary::before { content: "▸"; transition: transform .15s; }
  .more[open] > summary::before { transform: rotate(-90deg); }
  .more[open] > summary { margin-bottom: 8px; }
  .prev-warn { display: flex; gap: 10px 14px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 10px 14px; border-radius: 12px; border: 1px solid color-mix(in srgb, var(--warn) 55%, transparent); background: color-mix(in srgb, var(--warn) 10%, var(--surface)); font-size: 14.5px; }
  .prev-warn a { color: var(--glow); text-decoration: underline; }
  .pager { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
  .empty-l { padding: 28px; text-align: center; color: var(--fg-2); }

  @media (max-width: 1080px) { .l-grid { grid-template-columns: 1fr; } .l-aside { position: static; order: -1; } .toc { display: none; } }
  @media (max-width: 760px) { .cases { grid-template-columns: repeat(2, minmax(0, 1fr)); } .connected { grid-template-columns: 1fr; } .ex-split { grid-template-columns: 1fr; } .pb-head { grid-template-columns: 1fr; } .terms { grid-template-columns: 1fr; } .terms dt { margin-top: 6px; } }
  @media (max-width: 900px) { .main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); } .l-sec { padding: 16px; } }
  /* Real-World Visuals: a real photo of the law at work, under the laws section */
  .rwv { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 14px; margin-top: 14px; }
  .rwv-fig { margin: 0; border: 1px solid var(--line-soft); border-radius: 12px; overflow: hidden; background: var(--surface-2); display: grid; }
  .rwv-img { aspect-ratio: 16 / 10; background: #071029; overflow: hidden; }
  .rwv-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .rwv-fig figcaption { padding: 10px 12px 12px; display: grid; gap: 5px; font-size: 13.5px; line-height: 1.65; }
  .rwv-law { font-family: var(--font-mono, monospace); font-size: 12px; color: var(--glow); justify-self: start; }
  .rwv-cap { color: var(--fg); }
  .rwv-cr { font-size: 11.5px; color: var(--fg-3); } .rwv-cr a { color: inherit; text-decoration: underline; }
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side" aria-label="القائمة الرئيسية">
    <a class="logo" href="index.html" aria-label="CircuitVision">
      <svg viewBox="0 0 34 24" aria-hidden="true"><defs><linearGradient id="lg" x1="0" x2="1"><stop offset="0" stop-color="#3fb6ff"/><stop offset="1" stop-color="#2f7bff"/></linearGradient></defs><path d="M14 4.5A8.5 8.5 0 1 0 14 19.5" fill="none" stroke="url(#lg)" stroke-width="3.2" stroke-linecap="round"/><path d="M16 4l7 16 7-16" fill="none" stroke="url(#lg)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      CircuitVision
    </a>
    <nav id="nav"></nav>
    <div class="side-foot" id="side-foot"></div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <main class="main" id="main">
    <div class="mobile-top">
      <a class="logo" href="index.html" aria-label="CircuitVision">
        <svg viewBox="0 0 34 24" aria-hidden="true"><path d="M14 4.5A8.5 8.5 0 1 0 14 19.5" fill="none" stroke="#3fb6ff" stroke-width="3.2" stroke-linecap="round"/><path d="M16 4l7 16 7-16" fill="none" stroke="#2f7bff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        CircuitVision
      </a>
      <button class="menu-btn" id="menu-btn" aria-label="فتح القائمة" aria-expanded="false" aria-controls="side"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    </div>
    <div id="lesson-root"></div>
  </main>
</div>

<script src="store.js"></script>
<script src="bi.js"></script>
<script src="ui.en.js"></script><script src="c1-variables.en.js"></script>
<script src="config.js"></script>
<script src="cloud.js"></script>
<script src="curriculum.js"></script>
<script src="shell.js"></script>
<script src="feedback.js"></script>
<script src="tutor.js"></script>
<script src="mna.js"></script>
<script src="draw.js"></script>
<script src="gen.js"></script>
<script src="analysis.js"></script>
<script src="ac.js"></script>
<script src="mathcheck.js"></script>
<script src="workspace.js"></script><script src="stepcheck.js"></script>
<script src="practice.js"></script>
<script src="c1-variables.js"></script>
<script src="c1-elements.js"></script>
<script src="c1-resistive.js"></script>
<script src="c1-techniques.js"></script>
<script src="c1-sinusoidal.js"></script>
<script src="c1-power.js"></script>
<script src="summaries.js"></script><script src="visuals.js"></script>
<script src="labsim.js"></script>
<script src="experiments.js"></script>
<script>
  function labCard(L) {
    var X = CV.labExperiments, x = X && X.list[L.id], st = x && CV.store.labExp(L.id), lk = 'style="color:var(--glow);text-decoration:underline"';
    if (x) return '<div class="pending"><span class="ic">' + CV.shell.icon("lab") + '</span><p><b>تجربة المعمل: ' + x.title + (st && st.completedAt ? ' ✓' : '') + '</b>' + x.intro + ' <a href="lab.html#exp-' + L.id + '" ' + lk + '>' + (st && st.completedAt ? "أعد التجربة في المعمل الذكي" : "ابدأ التجربة الموجّهة (" + x.steps.length + " خطوات)") + '</a></p></div>';
    var why = X && X.unavailable[L.id];
    return '<div class="pending"><span class="ic">' + CV.shell.icon("lab") + '</span><p><b>تجربة المعمل: ' + L.lab.title + '</b>' + L.lab.desc + ' ' + (why ? "لا توجد تجربة موجّهة لهذا الدرس: " + why : "هذه التجربة الموجّهة لم تُجهّز بعد.") + ' يمكنك بناء دوائرك وقياسها بنفسك في <a href="lab.html" ' + lk + '>المعمل الذكي</a>.</p></div>';
  }
(function () {
  "use strict";
  var S = CV.store, root = document.getElementById("lesson-root");
  CV.shell.init({ active: "courses" });

  // Flatten published lessons with their course/chapter context.
  var list = [];
  CV.courses.forEach(function (c) {
    c.chapters.forEach(function (ch) {
      ch.lessons.forEach(function (l, i) {
        if (l.published && CV.lessons[l.id]) list.push({ id: l.id, course: c, chapter: ch, index: i, data: CV.lessons[l.id] });
      });
    });
  });
  function find(id) { for (var i = 0; i < list.length; i++) if (list[i].id === id) return i; return -1; }
  function defaultId() {
    var d = S.get();
    for (var i = 0; i < list.length; i++) if (!d.lessons[list[i].id]) return list[i].id;
    return list.length ? list[0].id : null;
  }

  var pendingSec = null, problemCtl = null;
  var icoVideo = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3z"/></svg>';

  var KEEP = "div.flow, table, svg, .eq, .lfig, figure, .cases, .ex-split, .prefixes, dl";
  function short(s, SUM) {
    var key = { concept: "c", when: "w", realworld: "r" }[s.id], top = "";
    if (!SUM || !key || !SUM[key]) return '<div class="prose">' + s.html + '</div>';
    var x = SUM[key];
    top = Array.isArray(x) ? '<ul class="ticks sum-l">' + x.map(function (t) { return "<li>" + t + "</li>"; }).join("") + '</ul>' : '<p class="sum">' + x + '</p>';
    var box = document.createElement("div"); box.innerHTML = s.html;
    var vis = "";
    if (s.id === "concept") Array.prototype.slice.call(box.children).forEach(function (el) { if (el.matches(KEEP)) { vis += el.outerHTML; el.remove(); } });
    var rest = box.innerHTML.trim();
    return '<div class="prose">' + top + vis + (rest ? '<details class="more"><summary>اشرح أكثر</summary><div class="prose">' + rest + '</div></details>' : "") + '</div>';
  }
  function sec(id, title, en, inner, extra) {
    return '<section class="l-sec card" id="sec-' + id + '"><div class="sec-h"><h2>' + title + '</h2>' + (en ? '<span class="en">' + en + '</span>' : '') + (extra || '') + '</div>' + inner + '</section>';
  }

  function render() {
    if (!list.length) { root.innerHTML = '<div class="card empty-l">لا توجد دروس منشورة بعد.</div>'; return; }
    var id = location.hash.slice(1);
    var idx = find(id);
    if (idx === -1) { idx = find(defaultId()); }
    var it = list[idx], L = it.data, d = S.get();
    document.title = L.ar + " — CircuitVision";

    var chapterLessons = list.filter(function (x) { return x.chapter.id === it.chapter.id; });
    // Every published chapter of this course, so any lesson is one click away.
    var chips = it.course.chapters.map(function (ch, ci) {
      var first = list.filter(function (x) { return x.chapter.id === ch.id; })[0];
      var doneN = list.filter(function (x) { return x.chapter.id === ch.id && d.lessons[x.id]; }).length;
      var total = list.filter(function (x) { return x.chapter.id === ch.id; }).length;
      if (!first) return '<span class="chap off" title="قيد الإعداد"><span class="cn">' + (ci + 1) + '</span><span class="ct">' + ch.ar + '</span></span>';
      return '<a class="chap' + (ch.id === it.chapter.id ? ' cur" aria-current="true' : '') + '" href="#' + first.id + '"><span class="cn">' + (ci + 1) + '</span><span class="ct">' + ch.ar + '</span><span class="cp">' + doneN + '/' + total + '</span></a>';
    }).join("");
    var tabs = chapterLessons.map(function (x, i) {
      return '<a class="ch-tab' + (x.id === it.id ? ' cur' : '') + (d.lessons[x.id] ? ' done' : '') + '" href="#' + x.id + '"' + (x.id === it.id ? ' aria-current="page"' : '') + '><span class="n">' + (d.lessons[x.id] ? '✓' : i + 1) + '</span><span class="t">' + x.data.ar + '</span></a>';
    }).join("");

    var order = ["concept", "diagram", "terms", "laws", "when", "example"];
    var byId = {}; L.sections.forEach(function (s) { byId[s.id] = s; });
    var body = "";
    var toc = [];
    var SUM = (CV.lessonSum || {})[L.id];
    order.forEach(function (k) { var s = byId[k]; if (!s) return; body += sec(s.id, s.title, s.en, short(s, SUM) + (k === "laws" && CV.lessonVisualHtml ? CV.lessonVisualHtml(L.id) : "")); toc.push([s.id, s.title]); });

    body += sec("video", "الفيديو التعليمي", "Micro-Lesson",
      '<div class="vids">' +
      '<div class="pending"><span class="ic">' + icoVideo + '</span><p><b>الشرح النظري · قيد التسجيل</b>فيديو قصير (3 إلى 7 دقائق) بالعربية يشرح فكرة الدرس. سيظهر هنا عند رفعه.</p></div>' +
      '<div class="pending"><span class="ic">' + icoVideo + '</span><p><b>الجزء العملي · قيد التسجيل</b>فيديو يبني تجربة هذا الدرس على لوحة التجارب ويقيسها بالأجهزة. سيظهر هنا عند رفعه.</p></div>' +
      '<div class="pending"><span class="ic">' + icoVideo + '</span><p><b>المشروع الهندسي · قيد التسجيل</b>فيديو يمشي معك في مشروع الدرس من التصميم إلى القياس. سيظهر هنا عند رفعه.</p></div></div>');
    toc.push(["video", "الفيديوهات"]);

    body += sec("practice", "تمرين مع Smart Feedback", "Guided Practice",
      '<div id="problem"></div><div class="pb-allok">✓ حللت التمرين كاملًا.</div><div id="workspace"></div>', '<span class="sf-badge">يشرح لك أين أخطأت ولماذا</span>');
    toc.push(["practice", "التمرين"]);

    var qz = L.quiz.map(function (q, qi) {
      return '<div class="qz" data-q="' + qi + '"><p class="qz-q"><span class="n">' + (qi + 1) + '.</span>' + q.q + '</p><div class="qz-opts">' +
        q.options.map(function (o, oi) { return '<button type="button" class="qz-opt" data-o="' + oi + '">' + o.t + '</button>'; }).join("") +
        '</div><div class="qz-fb" hidden aria-live="polite"></div></div>';
    }).join("");
    body += sec("quiz", "اختبار قصير", "Quick Check", '<div style="display:grid; gap:10px">' + qz + '</div>');
    toc.push(["quiz", "الاختبار"]);

    if (L.generator) {
      body += sec("generated", L.generator.title, "Generated Practice", '<p class="muted">كل دائرة هنا يولّدها المحرك بشكل مختلف ويحلها قبل عرضها. هذه التمارين إضافية ولا تؤثر على إكمال الدرس.</p><div id="gen-practice"></div>');
      toc.push(["generated", "تمارين مولّدة"]);
    }
    if (byId.realworld) { body += sec("realworld", byId.realworld.title, byId.realworld.en, short(byId.realworld, SUM)); toc.push(["realworld", "في الواقع"]); }

    body += sec("matlab", "الدرس في MATLAB", "MATLAB",
      '<div class="pending"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M12 15h5"/></svg></span><p><b>قيد الإعداد</b>لكل درس سكربت MATLAB يحل مثال الدرس ويرسم نتائجه، تشغّله وتعدّل قيمه بنفسك. يُضاف هنا عند إعداده.</p></div>');
    toc.push(["matlab", "MATLAB"]);

    body += sec("connected", "مرتبط بهذا الدرس", "Connected",
      '<div class="connected">' + labCard(L) + '<div class="pending"><span class="ic">' + CV.shell.icon("academy") + '</span><p><b>مشروع الدرس</b>مشروع يطبّق فكرة هذا الدرس بالضبط: تصمم، تحاكي، تبني على لوحة التجارب، وتقيس. <a href="academy.html#' + L.id + '" style="color:var(--glow);text-decoration:underline">افتح المشروع</a></p></div>' +
      '<div class="pending"><span class="ic">' + CV.shell.icon("bank") + '</span><p><b>بنك الأسئلة</b>كل أسئلة هذا الدرس وتمارينه في مكان واحد. <a href="bank.html" style="color:var(--glow);text-decoration:underline">افتح بنك الأسئلة</a>. أسئلة الكتب (Nilsson و Sadiku) تُضاف فقط من نصوص يوفّرها المؤسس.</p></div></div>');

    var prev = list[idx - 1], next = list[idx + 1];
    var warnKey = "cv.prevwarn." + it.id, warned = false; try { warned = sessionStorage.getItem(warnKey) === "1"; } catch (x) {}
    if (prev && !d.lessons[prev.id] && !warned) body = '<div class="prev-warn" id="prev-warn" role="status"><span>⚠ لم تُتمّ الدرس السابق <b>' + prev.data.ar + '</b>. تقدر تكمل هنا عادي، أو <a href="#' + prev.id + '">ارجع له</a>.</span><button type="button" class="btn btn-ghost btn-sm" id="prev-warn-x">إخفاء</button></div>' + body;
    body += '<section class="finish card" id="finish"><div><b style="font-family:var(--font-display)" id="finish-title"></b><p id="finish-text"></p></div><button class="btn btn-primary" id="complete-btn" type="button"></button></section>';
    body += '<div class="pager">' + (prev ? '<a class="btn btn-ghost btn-sm" href="#' + prev.id + '"><span>→</span> ' + prev.data.ar + '</a>' : '<span></span>') + (next ? '<a class="btn btn-ghost btn-sm" href="#' + next.id + '">' + next.data.ar + ' <span>←</span></a>' : '<a class="btn btn-ghost btn-sm" href="dashboard.html">العودة للوحة الطالب</a>') + '</div>';

    root.innerHTML =
      '<div style="display:grid; gap:16px">' +
      '<nav class="crumbs" aria-label="المسار"><a href="dashboard.html">المقررات</a><span>›</span><span class="ltr">' + it.course.code + '</span><span>›</span><span>' + it.chapter.ar + '</span></nav>' +
      '<nav class="chaps" aria-label="فصول ' + it.course.code + '">' + chips + '</nav>' +
      '<div class="ch-tabs" aria-label="دروس الفصل">' + tabs + '</div>' +
      '<header class="l-head"><span class="eyebrow">الدرس ' + (it.index + 1) + ' من ' + chapterLessons.length + ' · ' + it.chapter.ar + '</span><h1>' + L.ar + '</h1><span class="en ltr">' + L.en + '</span><div class="l-meta"><span>حوالي ' + L.minutes + ' دقيقة</span><span>تمرين واحد بخطوات</span><span>' + L.quiz.length + ' أسئلة اختبار</span></div></header>' +
      '<div class="l-grid"><div class="l-body">' +
      '<div class="obj card"><b>بعد هذا الدرس ستستطيع:</b><ul>' + L.objectives.map(function (o) { return '<li>' + o + '</li>'; }).join("") + '</ul></div>' +
      body + '</div>' +
      '<aside class="l-aside"><div class="req card"><b>لتسجيل الدرس في تقدمك</b><span class="muted" style="font-size:12.5px">يمكنك التنقل بين الدروس بحرية، وهذا فقط لاحتساب التقدم.</span><ul><li id="req-practice">حل التمرين بكل خطواته</li><li id="req-quiz">أجب عن أسئلة الاختبار صحيحًا</li></ul></div>' +
      '<nav class="toc card" aria-label="محتوى الدرس"><b>في هذا الدرس</b>' + toc.map(function (t) { return '<a href="#' + it.id + '" data-sec="' + t[0] + '">' + t[1] + '</a>'; }).join("") + '</nav></aside>' +
      '</div></div>';

    var curChap = root.querySelector(".chap.cur"), chapsRow = root.querySelector(".chaps");
    if (curChap && chapsRow) chapsRow.scrollLeft += curChap.getBoundingClientRect().left - chapsRow.getBoundingClientRect().left - (chapsRow.clientWidth - curChap.offsetWidth) / 2;

    // Practice
    problemCtl = CV.feedback.renderProblem(document.getElementById("problem"), L.practice, it.id, { onChange: updateReq, focus: true, title: L.ar });

    // the exercise's circuit, when it is a DC circuit the solver can solve: the workspace then checks every written step on it
    var pc = L.practice.circuit, pctx = null;
    if (pc && !pc.omega && CV.stepcheck) try {
      var psol = CV.mna.solve(pc);
      if (psol.ok) pctx = { c: pc, sol: psol, nodes: pc.nodeLabels && pc.nodeLabels.length ? pc.nodeLabels : CV.analysis.nodeLabels(pc), meshes: CV.analysis.meshes(pc, psol) || [] };
    } catch (x) { pctx = null; }
    CV.workspace.mount(document.getElementById("workspace"), { key: it.id, lessonId: it.id,
      context: L.practice.prompt.replace(/<[^>]+>/g, ""),
      circuit: pctx ? function () { return pctx; } : null,
      onLabels: pctx ? function () {
        pc.nodeLabels = pctx.nodes; pc.meshLabels = pctx.meshes;
        var lf = document.querySelector("#problem .lfig"); if (lf) lf.innerHTML = CV.draw.render(pc, { aria: "دائرة التمرين مع أسماء العقد والحلقات" });
      } : null,
      tutor: pctx && CV.tutor ? function () { return CV.tutor.fromProblem(L.practice, it.id, L.ar); } : null,
      onAnswer: function (v) {
        var step = document.querySelector("#problem .pb-step[data-state='active']");
        return !!step && CV.workspace.fillAnswer(step.querySelector(".pb-input"), step.querySelector(".pb-unit"), v);
      } });
    if (L.generator) CV.practice.mount(document.getElementById("gen-practice"), Object.assign({ lessonId: it.id }, L.generator));

    // Quiz
    var qd = d.quiz[it.id] || {};
    root.querySelectorAll(".qz").forEach(function (box) {
      var qi = +box.dataset.q, q = L.quiz[qi], fb = box.querySelector(".qz-fb");
      function markSolved() {
        box.querySelectorAll(".qz-opt").forEach(function (b, oi) { b.disabled = true; if (q.options[oi].correct) b.classList.add("right"); });
      }
      if (qd[qi]) { markSolved(); fb.hidden = false; fb.className = "qz-fb good"; fb.innerHTML = "✓ " + (q.options.filter(function (o) { return o.correct; })[0].why || "إجابة صحيحة."); }
      box.addEventListener("click", function (e) {
        var b = e.target.closest(".qz-opt"); if (!b || b.disabled) return;
        var o = q.options[+b.dataset.o];
        fb.hidden = false;
        if (o.correct) {
          S.recordQuiz(it.id, qi); markSolved();
          fb.className = "qz-fb good"; fb.innerHTML = "✓ " + (o.why || "إجابة صحيحة.");
          updateReq();
        } else {
          S.recordAttempt(it.id, "quiz-" + qi, false, o.type || "unclassified");
          b.classList.add("wrong"); b.disabled = true;
          var t = o.type && CV.feedback.TYPES[o.type];
          fb.className = "qz-fb bad";
          fb.innerHTML = (t ? '<span><span class="fb-type">' + t.ar + ' <span class="ltr">· ' + t.en + '</span></span></span>' : '') + '<span>' + o.why + '</span><span class="muted">جرّب مرة أخرى.</span>';
        }
      });
    });

    var pwx = document.getElementById("prev-warn-x"); if (pwx) pwx.addEventListener("click", function () { try { sessionStorage.setItem(warnKey, "1"); } catch (x) {} document.getElementById("prev-warn").remove(); });
    document.getElementById("complete-btn").addEventListener("click", function () {
      if (this.disabled) return;
      S.completeLesson(it.id, "أكملت درس: " + L.ar);
      if (next) location.hash = next.id; else render();
    });
    updateReq();

    if (pendingSec) { goSec(pendingSec); pendingSec = null; }
    else window.scrollTo(0, 0);

    function updateReq() {
      var dd = S.get(), q = dd.quiz[it.id] || {};
      var pOk = problemCtl.status().solved;
      var qOk = L.quiz.every(function (_, i) { return q[i]; });
      document.getElementById("req-practice").classList.toggle("ok", pOk);
      document.getElementById("req-quiz").classList.toggle("ok", qOk);
      var done = !!dd.lessons[it.id], btn = document.getElementById("complete-btn");
      var ft = document.getElementById("finish-title"), fx = document.getElementById("finish-text");
      if (done) { ft.textContent = "✓ أكملت هذا الدرس"; fx.textContent = "يمكنك مراجعته في أي وقت."; btn.textContent = next ? "الدرس التالي" : "العودة للوحة الطالب"; btn.disabled = false; btn.onclick = function () { if (next) location.hash = next.id; else location.href = "dashboard.html"; }; }
      else if (pOk && qOk) { ft.textContent = "جاهز لإنهاء الدرس"; fx.textContent = "حللت التمرين وأجبت عن الاختبار."; btn.textContent = "أكملت هذا الدرس"; btn.disabled = false; }
      else { ft.textContent = "لم يُسجَّل الدرس في تقدمك بعد"; fx.textContent = "حل التمرين وأجب عن أسئلة الاختبار ليُحسب الدرس في تقدمك. يمكنك الانتقال لأي درس آخر في أي وقت."; btn.textContent = "أكملت هذا الدرس"; btn.disabled = true; }
    }
  }

  function goSec(id) {
    var el = document.getElementById("sec-" + id); if (!el) return;
    el.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
    el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
  }

  document.addEventListener("click", function (e) {
    var a = e.target.closest("a[data-sec]"); if (!a) return;
    var target = a.getAttribute("data-lesson") || location.hash.slice(1);
    if (!a.getAttribute("data-lesson") || target === (location.hash.slice(1) || defaultId())) { e.preventDefault(); goSec(a.dataset.sec); }
    else pendingSec = a.dataset.sec;
  });
  window.addEventListener("hashchange", render);
  render();
})();
</script>
<script src="calc.js"></script>
</body>
</html>
