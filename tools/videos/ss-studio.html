<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Signals and Systems — video studio</title>
<link rel="stylesheet" href="../../sig.css">
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0b1424; color: #e6ecf6; }
  body, body * { font-family: "DejaVu Sans", sans-serif !important; }
  :root { --fg-2: #c3cbda; --fg-3: #8d9ab3; --line-soft: #1d2a44; --bg-2: #101c33; }
  .top { position: absolute; top: 0; inset-inline: 0; height: 92px; display: flex; align-items: center; gap: 22px; padding: 0 56px; background: #0e1a2f; border-bottom: 1px solid #1d2a44; }
  .top .brand { color: #2f7bff; font-weight: 700; font-size: 28px; direction: ltr; }
  .top .ttl { font-size: 26px; color: #c3cbda; }
  .top .ch { margin-inline-start: auto; font-size: 22px; color: #8d9ab3; }
  .prog { position: absolute; top: 92px; inset-inline: 0; height: 6px; background: #14213a; }
  .prog i { display: block; height: 100%; background: #f08a24; }
  .stage { position: absolute; top: 120px; bottom: 50px; inset-inline: 56px; display: grid; grid-template-columns: 1fr; gap: 40px; }
  .stage.two { grid-template-columns: 760px 1fr; }
  .txt { display: flex; flex-direction: column; justify-content: center; gap: 22px; }
  .txt h2 { margin: 0; font-size: 44px; color: #fff; display: flex; align-items: center; gap: 18px; }
  .txt h2::before { content: ""; width: 10px; height: 46px; background: #f08a24; border-radius: 5px; }
  .txt .body { font-size: 33px; line-height: 1.75; color: #dbe3f0; }
  .txt .body p { margin: 0; }
  .eq-i { font-family: "DejaVu Sans Mono", monospace !important; color: #7fb2ff; direction: ltr; unicode-bidi: isolate; display: inline-block; font-size: .9em; }
  .eq { font-family: "DejaVu Sans Mono", monospace !important; direction: ltr; text-align: center; background: #101c33; border: 1px solid #22304b; border-radius: 14px; padding: 16px 22px; margin: 0 0 14px; font-size: 31px; color: #e6ecf6; }
  .eq-n { font-size: 20px; color: #8d9ab3; margin-top: 6px; display: block; direction: rtl; }
  ol.steps { margin: 0; padding-inline-start: 46px; display: grid; gap: 16px; }
  ol.steps li { color: #8d9ab3; font-size: 30px; } ol.steps li.now { color: #fff; }
  ol.steps li::marker { color: #f08a24; }
  ul.ticks { margin: 0; padding: 0; list-style: none; display: grid; gap: 18px; }
  ul.ticks li { padding-inline-start: 36px; position: relative; } ul.ticks li::before { content: "✓"; position: absolute; inset-inline-start: 0; color: #23a26d; }
  .pl { display: flex; flex-direction: column; justify-content: center; background: #0e1a2f; border: 1px solid #1d2a44; border-radius: 22px; padding: 26px; }
  .pl .sp { width: 100%; max-height: 760px; }
  .pl .sp { max-width: 100%; margin: auto; } .pl .sp-ln { stroke-width: 2.8; }
  .pl .cap { text-align: center; color: #8d9ab3; font-size: 24px; margin-top: 14px; }
  .card { position: absolute; inset: 120px 56px 50px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 26px; }
  .card .eb { color: #f08a24; font-size: 28px; }
  .card h1 { margin: 0; font-size: 72px; color: #fff; max-width: 1500px; line-height: 1.3; }
  .card .en { direction: ltr; color: #8d9ab3; font-size: 32px; }
  .card ul { list-style: none; padding: 0; margin: 20px 0 0; display: grid; gap: 14px; font-size: 30px; color: #c3cbda; }
  .card ul li::before { content: "◆ "; color: #2f7bff; }
  .foot { position: absolute; bottom: 14px; inset-inline: 56px; display: flex; justify-content: space-between; color: #5f6d88; font-size: 18px; }
</style>
</head>
<body>
<div class="top"><span class="brand">CircuitVision</span><span class="ttl" id="ttl"></span><span class="ch" id="ch"></span></div>
<div class="prog"><i id="pg"></i></div>
<div id="main"></div>
<div class="foot"><span>تحليل الإشارات والنظم · EE 3010</span><span dir="ltr">circuitvision1.vercel.app</span></div>
<script src="../../sig-plot.js"></script>
<script src="../../ss-build.js"></script>
<script src="../../ss-ch1.js"></script><script src="../../ss-ch2.js"></script><script src="../../ss-ch3.js"></script><script src="../../ss-ch4.js"></script><script src="../../ss-ch5.js"></script><script src="../../ss-ch6.js"></script><script src="../../ss-ch7.js"></script>
<script>
  var CV = window.CV;
  window.show = function (id, i, prog) {
    var L = CV.lessons[id], s = CV.ssVideo[id][i], main = document.getElementById("main");
    document.getElementById("ttl").textContent = L.ar;
    document.getElementById("ch").textContent = s.kind === "card" ? "" : (CV.ssVideo[id][0].eyebrow || "").split("· ")[1] || "";
    document.getElementById("pg").style.width = (prog * 100).toFixed(2) + "%";
    if (s.kind === "card") {
      main.innerHTML = '<div class="card"><div class="eb">' + s.eyebrow + '</div><h1>' + s.title + '</h1><div class="en">' + s.en + '</div>' + (s.lines.length ? '<ul>' + s.lines.map(function (l) { return "<li>" + l + "</li>"; }).join("") + '</ul>' : '') + '</div>';
      return;
    }
    var plot = s.plot ? '<div class="pl">' + CV.sp.plot(s.plot) + (s.cap ? '<div class="cap">' + s.cap + '</div>' : '') + '</div>' : '';
    var tt = String(s.title).replace(/[A-Za-z(|][^\u0600-\u06FF]*[A-Za-z0-9)\]|]/g, function (w) { return "<bdi dir='ltr'>" + w + "</bdi>"; });
    main.innerHTML = '<div class="stage' + (plot ? ' two' : '') + '"><div class="txt"><h2>' + tt + '</h2><div class="body">' + s.html + '</div></div>' + plot + '</div>';
  };
  window.list = function () { return Object.keys(CV.ssVideo).map(function (id) { return { id: id, scenes: CV.ssVideo[id].map(function (s) { return s.dur; }) }; }); };
</script>
</body>
</html>
