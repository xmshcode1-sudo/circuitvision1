<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>CircuitVision · video studio (lessons)</title>
<!-- One 1920×1080 frame of a lesson video, in the same frame as the lab videos (tools/videos/studio.html):
     header, the drawing panel on the left, the explanation column on the right, an orange progress bar.
     Driven by tools/videos/lesson-render.py: window.show(id, i, progress). Not part of the site. -->
<link rel="stylesheet" href="../../sig.css">
<link rel="stylesheet" href="../../lg.css">
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #050914; }
  body, body * { font-family: "DejaVu Sans", sans-serif !important; }
  :root { --fg: #e9eef7; --fg-2: #c3cbda; --fg-3: #8f9bb0; --line-soft: #26324a; --surface-2: #1a2336; --bg-2: #121927; --glow: #7fb2ff; }
  #frame { position: relative; width: 1920px; height: 1080px; background: #050914; color: #e9eef7; }
  #hdr-r { position: absolute; top: 20px; right: 28px; font-size: 22px; color: #9aa6bb; }
  #hdr-r b { color: #ff8a1f; font-weight: 700; }
  #hdr-l { position: absolute; top: 20px; left: 28px; font-size: 21px; color: #9aa6bb; }
  #dev { position: absolute; left: 28px; top: 70px; width: 1300px; height: 975px; border-radius: 22px; background: #121927; box-shadow: inset 0 0 0 1px #1e2738; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #vis { width: 1220px; max-height: 860px; display: flex; align-items: center; justify-content: center; direction: ltr; }
  #vis > svg, #vis .lgk-w svg, #vis .lgc, #vis .lgk { width: 100% !important; max-width: none !important; height: auto; max-height: 840px; }
  #vis .lgk-w { width: 820px; } #vis .lgk-legend { font-size: 30px; gap: 12px 22px; margin-top: 14px; }
  #vis .lgrow { gap: 40px; width: 100%; } #vis .lgrow > * { flex: 1 1 0; min-width: 0; }
  #vis .lgt { font-size: 34px; } #vis .lgt td, #vis .lgt th { padding: 8px 22px; } #vis .lgt.sm { font-size: 27px; } #vis .lgt.sm td, #vis .lgt.sm th { padding: 5px 14px; }
  #vis .lgt th { background: #1d3f91; color: #dbe6ff; border-color: #2a3f6e; } #vis .lgt td { border-color: #22304b; }
  #vis .lgt tr.on td { background: #1d3f91; color: #fff; } #vis .lgt tr.on td.v { color: #ff9f43; }
  #vis .sp-ln { stroke-width: 2.6; } #vis .sp-t { font-size: 12px; } #vis .sp-l { font-size: 13px; }
  #cap { margin-top: 18px; font-size: 24px; color: #8f9bb0; text-align: center; max-width: 1180px; direction: rtl; }
  .bd { width: 1160px; display: grid; gap: 22px; direction: rtl; }
  .bd-i { font-size: 34px; line-height: 1.6; color: #8f9bb0; padding: 16px 24px; border-radius: 16px; background: #0d1422; border: 1px solid #1e2738; }
  .bd-i.now { color: #fff; border-color: #ff8a1f; box-shadow: 0 0 0 1px #ff8a1f inset; }
  .bd-i p { margin: 0; } .bd-i .n { display: inline-block; min-width: 46px; color: #ff8a1f; font-weight: 700; }
  .eqb .eq { font-size: 34px; }
  .eq { font-family: "DejaVu Sans Mono", monospace !important; direction: ltr; text-align: center; background: #0d1422; border: 1px solid #1e2738; border-radius: 14px; padding: 14px 20px; color: #e9eef7; margin: 0; }
  .eq-n { display: block; font-size: .62em; color: #8f9bb0; margin-top: 6px; direction: rtl; font-family: "DejaVu Sans", sans-serif !important; }
  .eq-i { font-family: "DejaVu Sans Mono", monospace !important; color: #7fb2ff; direction: ltr; unicode-bidi: isolate; display: inline-block; }
  #side { position: absolute; left: 1352px; top: 70px; width: 540px; height: 975px; display: flex; flex-direction: column; gap: 18px; overflow: hidden; }
  .t { border-right: 6px solid #ff8a1f; padding-right: 18px; font-size: 33px; font-weight: 700; line-height: 1.32; color: #fff; }
  .sub { font-size: 26px; font-weight: 700; color: #ff9f43; }
  .ln { font-size: 25px; line-height: 1.62; color: #c3cbda; }
  .ln { overflow-wrap: anywhere; } .ln .eq-i { display: inline; } .ln p { margin: 0 0 8px; } .ln b { color: #fff; }
  .ln .eq { font-size: 21px; padding: 8px 10px; margin: 8px 0; }
  ol.steps { margin: 0; padding: 0 30px 0 0; display: grid; gap: 12px; } ol.steps li { color: #8f9bb0; } ol.steps li.now { color: #fff; } ol.steps li::marker { color: #ff8a1f; }
  ul.ticks { margin: 0; padding: 0; list-style: none; display: grid; gap: 14px; } ul.ticks li { padding-right: 34px; position: relative; } ul.ticks li::before { content: "✓"; position: absolute; right: 0; color: #23a26d; }
  #prog { position: absolute; left: 0; bottom: 0; height: 8px; background: #ff8a1f; }
  #card { position: absolute; inset: 0; display: none; background: radial-gradient(1100px 700px at 70% 22%, #11307a 0%, #0a1a45 38%, #050914 78%); text-align: center; }
  #card .eb { position: absolute; top: 380px; width: 100%; font-size: 26px; color: #ff9f43; }
  #card .ti { position: absolute; top: 430px; width: 100%; font-size: 56px; font-weight: 700; color: #fff; padding: 0 120px; box-sizing: border-box; line-height: 1.3; }
  #card .en { position: absolute; top: 590px; width: 100%; font-size: 25px; color: #9fb0d0; direction: ltr; }
  #card .ls { position: absolute; top: 650px; width: 100%; font-size: 25px; line-height: 1.75; color: #dfe6f3; }
  #card .ft { position: absolute; bottom: 48px; width: 100%; font-size: 22px; color: #7b88a6; direction: ltr; }
:root { --orange: #ff8a3d; --orange-soft: rgba(255,138,61,.18); --ok: #4ade80; --surface: #0f1522; --font-mono: "JetBrains Mono", ui-monospace, monospace; }
/* ---------- Schematics (engine/draw.js) ---------- */
.sc { width: 100%; height: auto; display: block; margin-inline: auto; direction: ltr; }
.sc-w { stroke: var(--fg-2); stroke-width: 2.2; stroke-linecap: round; }
.sc-r { fill: none; stroke: var(--orange); stroke-width: 2.4; stroke-linejoin: round; }
.sc-src, .sc-dep { fill: var(--surface); stroke: var(--glow); stroke-width: 2.2; }
.sc-led { fill: var(--orange-soft, rgba(255,140,50,.18)); stroke: var(--orange); stroke-width: 2.2; stroke-linejoin: round; }
.sc-asked { stroke-width: 3.2; }
.sc-sign { fill: var(--fg); font: 600 15px var(--font-mono); }
.sc-arr-l { stroke: var(--glow); stroke-width: 2; }
.sc-arr { fill: var(--glow); }
.sc-iref { fill: var(--ok); }
.sc-ilbl { fill: var(--ok); font: 600 15px var(--font-mono); }
.sc-vpol { fill: var(--ok); font: 700 17px var(--font-mono); }
.sc-name { fill: var(--fg); font: 600 14px var(--font-mono); }
.sc-name.sc-asked { fill: var(--ok); }
.sc-val { fill: var(--fg-2); font: 500 13px var(--font-mono); }
.sc-dot { fill: var(--fg-2); }
.sc-plate { stroke: var(--orange); stroke-width: 3; stroke-linecap: round; }
.sc-plate.sc-asked { stroke-width: 4; }
.sc-omega { fill: var(--glow); font: 600 13px var(--font-mono); }
.sc-gnd { stroke: var(--fg-2); stroke-width: 2.2; stroke-linecap: round; }
.sc-nd { fill: var(--fg-2); }
.sc-nd.on { fill: var(--ok); }
.sc-ndl { fill: var(--glow); font: 600 14px var(--font-mono); }
.sc-ndl.on { fill: var(--ok); font-size: 15px; }
.sc-mesh { fill: none; stroke: var(--glow); stroke-width: 1.8; opacity: .8; }
.sc-mesh.on { stroke: var(--ok); stroke-width: 2.4; opacity: 1; }
.sc-mesh-h { fill: var(--glow); }
.sc-mesh-h.on { fill: var(--ok); }
.sc-term { fill: var(--bg); stroke: var(--fg); stroke-width: 2; }
.sc-tlbl { fill: var(--fg); font: 700 16px var(--font-mono); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* Circuit figures inside a practice prompt take the full width */
.pb-head:has(.lfig) { grid-template-columns: minmax(0, 1fr); }
.pb-fig .lfig .sc { max-height: 360px; }

/* Phasor answer input */
.ph-in { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.ph-in .ph-form { width: auto; }
.ph-polar, .ph-rect { display: inline-flex; gap: 6px; align-items: center; }
.ph-in .pb-input { width: 110px; }
.ph-sym { font-family: var(--font-mono); color: var(--fg-2); font-size: 16px; }

/* Phasor diagrams */
.pd-wrap { display: grid; justify-items: center; padding: 8px; border-radius: 12px; background: var(--bg-2); border: 1px solid var(--line-soft); }
.pd { width: 100%; max-width: 260px; height: auto; direction: ltr; }
.pd-ax { stroke: var(--line); stroke-width: 1.2; }
.pd-t { fill: var(--fg-3); font: 11px var(--font-mono); }
.pd-v { stroke: var(--fg-2); stroke-width: 2.4; }
.pd-h { fill: var(--fg-2); }
.pd-l { fill: var(--fg); font: 600 12px var(--font-mono); }
.pd-v.pd-i { stroke: var(--glow); } .pd-h.pd-i, .pd-l.pd-i { fill: var(--glow); }
.pd-v.pd-o { stroke: var(--orange); } .pd-h.pd-o, .pd-l.pd-o { fill: var(--orange); }
.pd-v.pd-g { stroke: var(--ok); } .pd-h.pd-g, .pd-l.pd-g { fill: var(--ok); }
/* Waveform plot (power lessons) */
.pw { width: 100%; max-width: 520px; height: auto; direction: ltr; }
.pw-c { fill: none; stroke-width: 2.2; stroke: var(--fg-2); }
.pw-c.pw-i { stroke: var(--glow); } .pw-c.pw-p { stroke: var(--orange); stroke-width: 2.6; }
.pw-avg { stroke: var(--ok); stroke-width: 1.6; stroke-dasharray: 6 5; }
.pw-key { display: flex; flex-wrap: wrap; gap: 6px 16px; justify-content: center; font-size: .85rem; color: var(--fg-2); }
.pw-key i { display: inline-block; width: 18px; height: 3px; border-radius: 2px; vertical-align: middle; margin-inline-end: 6px; background: var(--fg-2); }
.pw-key .k-i { background: var(--glow); } .pw-key .k-p { background: var(--orange); } .pw-key .k-a { background: var(--ok); }
/* Breadboard illustration: a physical white board, drawn with fixed colours in both themes */
.bb-wrap { padding: 8px; border-radius: 12px; background: var(--bg-2); border: 1px solid var(--line-soft); overflow-x: auto; }
.bb { width: 100%; min-width: 300px; height: auto; direction: ltr; display: block; }
.bb-body { fill: #eef0f3; stroke: #c9ced6; stroke-width: 1.2; }
.bb-gap { fill: #dfe3e8; }
.bb-h { fill: #b4bac4; }
.bb-pin { fill: #6b7280; }
.bb-n { fill: #8a909a; font: 7.5px var(--font-mono); }
.bb-t { fill: #39404b; font: 700 9px var(--font-mono); }
.bb-tl { font-size: 6.5px; }
.bb-leg { stroke: #9aa1ab; stroke-width: 1.6; stroke-linecap: round; }
.bb-wire { fill: none; stroke-width: 3.2; stroke-linecap: round; }
.bb-lead { fill: none; stroke-width: 2.4; stroke-linecap: round; opacity: .92; }
.bb-res { fill: #e7c79a; stroke: #b48a52; stroke-width: 1; }
.bb-led { stroke: rgba(0,0,0,.35); stroke-width: 1; }
.bb-box { fill: #1c2433; stroke: #3a465c; }
.bb-bt { fill: #f1f4fa; font: 600 11px var(--font-body); }
.bb-bp { fill: #b8c2d6; font: 9.5px var(--font-mono); }
.bb-lcd { fill: #2a3320; font: 700 13px var(--font-mono); }
.bb-old { opacity: .6; }
.bb-new { filter: drop-shadow(0 0 3px rgba(255, 138, 43, .9)); }
.sc-sw { stroke: var(--orange); stroke-width: 2.6; stroke-linecap: round; }
.sc-sine { fill: none; stroke: var(--glow); stroke-width: 2; }
.sc-am { fill: var(--glow); font: 700 14px var(--font-mono); }
.sc-lampx { stroke: var(--orange); stroke-width: 2; stroke-linecap: round; }
/* AI tutor */
.pb-tutor { display: flex; justify-content: flex-start; margin-top: 10px; }
.tt-drawer { position: fixed; inset-block: 0; inset-inline-start: 0; width: min(420px, 100%); z-index: 60; background: var(--surface); border-inline-end: 1px solid var(--line); box-shadow: 0 0 40px rgba(0,0,0,.4); display: grid; grid-template-rows: auto 1fr; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tt-h { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line-soft); }
.tt-h b { font-family: var(--font-display); } .tt-t { color: var(--fg-3); font-size: 13px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tt-body { min-height: 0; display: flex; }
.tt { display: grid; grid-template-rows: minmax(0, 1fr) auto auto; gap: 8px; padding: 12px; width: 100%; min-height: 0; }
.tt-log { overflow-y: auto; display: flex; flex-direction: column; gap: 8px; min-height: 160px; }
.tt-m { padding: 9px 12px; border-radius: 12px; max-width: 88%; font-size: 14.5px; line-height: 1.7; overflow-wrap: anywhere; }
.tt-user { align-self: flex-start; background: var(--blue-soft); color: var(--fg); }
.tt-tutor { align-self: flex-end; background: var(--surface-2); }
.tt-sys { align-self: center; background: transparent; border: 1px dashed var(--orange); color: var(--orange); font-size: 13px; max-width: 100%; }
.tt-wait { color: var(--fg-3); }
.tt-empty { color: var(--fg-2); font-size: 14px; margin: 0; }
.tt-form { display: flex; gap: 8px; align-items: flex-end; }
.tt-in { flex: 1; min-width: 0; resize: none; font: inherit; padding: 10px 12px; min-height: 44px; max-height: 160px; line-height: 1.6; }
.tt-note { margin: 0; font-size: 12px; color: var(--fg-3); }
.tt-page { min-height: 480px; border-radius: 14px; }

  .mt { width: 1180px; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; direction: rtl; }
  .mt-i { display: grid; gap: 6px; padding: 18px 22px; border-radius: 16px; background: #0d1422; border: 1px solid #1e2738; }
  .mt-i span { font-size: 26px; color: #8f9bb0; } .mt-i b { font-family: "DejaVu Sans Mono", monospace !important; font-size: 44px; color: #7dffb0; direction: ltr; text-align: right; } .mt-i small { font-size: 24px; color: #8f9bb0; } .mt-i b.tx { font-family: "DejaVu Sans", sans-serif !important; direction: rtl; }
  .mt-sc { width: 1100px; margin-top: 24px; } .mt-sc svg { width: 100%; height: auto; }
  .mt-n { margin-top: 12px; font-size: 22px; color: #8f9bb0; direction: rtl; }
  #vis .lgt td.v { color: #ff9f43; }
</style>

<body>
<div id="frame">
  <div id="hdr-r"><b>CircuitVision</b> · <span id="crs"></span></div>
  <div id="hdr-l"></div>
  <div id="dev"><div id="vis"></div><div id="cap"></div></div>
  <div id="side"></div>
  <div id="card"><div class="eb"></div><div class="ti"></div><div class="en"></div><div class="ls"></div><div class="ft">CircuitVision · circuitvision1.vercel.app</div></div>
  <div id="prog"></div>
</div>
<script src="../../mna.js"></script><script src="../../ac.js"></script><script src="../../draw.js"></script>
<script src="../../sig-plot.js"></script>
<script src="../../lg-draw.js"></script>
<script src="../../ss-build.js"></script>
<script src="../../ss-ch1.js"></script><script src="../../ss-ch2.js"></script><script src="../../ss-ch3.js"></script><script src="../../ss-ch4.js"></script><script src="../../ss-ch5.js"></script><script src="../../ss-ch6.js"></script><script src="../../ss-ch7.js"></script>
<script src="../../ld-ch1.js"></script><script src="../../ld-ch2.js"></script><script src="../../ld-ch3.js"></script><script src="../../ld-ch4.js"></script><script src="../../ld-ch5.js"></script>
<script src="../../c2-ch1.js"></script><script src="../../c2-ch2.js"></script><script src="../../c2-ch3.js"></script>
<script src="../../c2lab.js"></script><script src="c2lab-video.js"></script>
<script>
(function () {
  var CV = window.CV, $ = function (id) { return document.getElementById(id); };
  var NAME = { "signals-systems": "تحليل الإشارات والنظم EE 3010", "logic-design": "التصميم المنطقي EE 2111", "circuits-2": "الدوائر الكهربائية 2 EE 2020", "circuits-2-lab": "معمل الدوائر الكهربائية 2 EE 2020" };
  function fit(el, min) { var fs = parseFloat(getComputedStyle(el).fontSize); while (el.scrollHeight > el.clientHeight + 2 && fs > min) { fs -= 1; el.style.fontSize = fs + "px"; } }
  window.show = function (id, i, prog) {
    var L = CV.lessons[id], all = CV.ssVideo[id], s = all[i], card = $("card");
    $("crs").textContent = NAME[L.course] || "";
    $("hdr-l").textContent = (all[0].eyebrow || "").split(" · ").slice(1).join(" · ");
    $("prog").style.width = (prog * 100).toFixed(2) + "%";
    if (s.kind === "card") {
      card.style.display = "block";
      card.querySelector(".eb").textContent = s.eyebrow; card.querySelector(".ti").textContent = s.title; card.querySelector(".en").textContent = s.en;
      card.querySelector(".ls").innerHTML = (s.lines || []).map(function (l) { return "<div>" + l + "</div>"; }).join("");
      return;
    }
    card.style.display = "none";
    var vis = $("vis"); vis.innerHTML = s.vis || ""; $("cap").innerHTML = s.cap || "";
    vis.style.direction = /class=.bd/.test(s.vis || "") ? "rtl" : "ltr";
    var side = $("side");
    side.innerHTML = '<div class="t">' + s.title + '</div>' + (s.sub ? '<div class="sub">' + s.sub + '</div>' : '') + '<div class="ln">' + (s.text || "") + '</div>';
    var ln = side.querySelector(".ln"); ln.style.fontSize = ""; ln.style.height = (975 - ln.offsetTop - 10) + "px"; ln.style.overflow = "hidden"; fit(ln, 15);
    var tb = vis.querySelector(".lgt"); if (tb) { var f = parseFloat(getComputedStyle(tb).fontSize); while ((vis.scrollHeight > 880 || vis.scrollWidth > 1240) && f > 14) { f -= 1; vis.querySelectorAll(".lgt").forEach(function (t) { t.style.fontSize = f + "px"; }); } }
    var bd = vis.querySelector(".bd"); if (bd) { vis.style.maxHeight = "880px"; var k = 1; while (vis.scrollHeight > 900 && k > 0.5) { k -= 0.05; bd.style.fontSize = ""; bd.querySelectorAll(".bd-i, .eq").forEach(function (e) { e.style.fontSize = (34 * k) + "px"; }); } }
  };
  window.list = function () { return Object.keys(CV.ssVideo).map(function (id) { return { id: id, scenes: CV.ssVideo[id].map(function (s) { return s.dur; }), still: CV.ssVideo[id].map(function (s) { return !!s.still; }) }; }); };
})();
</script>

</html>
