  #card .ft { position: absolute; bottom: 48px; width: 100%; font-size: 22px; color: #7b88a6; direction: ltr; }
  html[lang=en] #hdr-r, html[lang=en] #side, html[lang=en] table.tb, html[lang=en] #card, html[lang=en] table.tb td.l { direction: ltr; }

<body>
<div id="frame">
  <div id="hdr-r"><b>CircuitVision</b> · معمل الدوائر الكهربائية EE2010</div>
  <div id="hdr-l"></div>
  <div id="dev"><div id="bench"></div></div>
  <div id="side"></div>
  <div id="card"><div class="eb"></div><div class="ti"></div><div class="en"></div><div class="ls"></div><div class="ft">CircuitVision · circuitvision1.vercel.app</div></div>
  <div id="prog"></div>
</div>
<script>window.EN = /lang=en/.test(location.search); if (window.EN) { document.documentElement.dir = "ltr"; document.documentElement.lang = "en"; document.addEventListener("DOMContentLoaded", function () { var h = document.getElementById("hdr-r"); if (h) h.innerHTML = "<b>CircuitVision</b> · Circuits 1 Lab · EE 2010"; }); }</script>
<script>window.CV_CONFIG = {}; try { localStorage.clear(); } catch (e) {}</script>
<script>if (window.EN) try { localStorage.setItem("cv.lang", "en"); localStorage.setItem("cv.lang2", "solo"); } catch (e) {}</script>

<script>if (window.EN) { document.write('<script src="../../bi.js"><\/script><script src="../../ui.en.js"><\/script><script src="../../labs.en.js"><\/script>'); }</script>
<script>
(function () {
  "use strict";
  var bench = null, benchKey = "";
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  var PW = 1300, PH = 975;
  var RECT = { ps: [484, 16, 560, 246], fg: [16, 16, 452, 246], sc: [1060, 16, 524, 246], d1: [16, 282, 190, 356], d2: [214, 282, 190, 356], board: [420, 282, 770, 650], mn: [16, 16, 560, 520] };
  function boxOfPoint(id) {
    var k = id.split(".")[0];
    if (RECT[k]) return RECT[k];
    if (/^(rb|lb|cb)$/.test(k)) { var j = bench.point(k + ".a"); return j ? [j[0] - 334, j[1] - 80, 378, 200] : null; }
    if (k === "lamp") return [600, 40, 600, 220];
    var q = bench.point(id); return q ? [q[0] - 30, q[1] - 30, 60, 60] : null;
  }
  function union(a, b) { if (!a) return b; if (!b) return a; var x = Math.min(a[0], b[0]), y = Math.min(a[1], b[1]); return [x, y, Math.max(a[0] + a[2], b[0] + b[2]) - x, Math.max(a[1] + a[3], b[1] + b[3]) - y]; }
  function viewFor(scene) {
    var sz = bench.size(), W = sz.W, H = sz.H, r = null, f = scene.focus;
    if (scene.view) r = scene.view.slice();
    else if (scene.inst.indexOf("mn") > -1) {   // Lab 10: the whole bench to set up, the power meter close up for each reading
      (scene.marks || []).forEach(function (m) { if (m.box) r = union(r, m.box); });
      if (!r) r = [0, 0, W, H];
    } else if (f === "all") r = [0, 0, W, H];
    else {
      if (f === "board" || f === "leads" || f === "meters") {   // the part of the board the circuit uses
        var c = null;
        Object.keys(scene.state.parts).forEach(function (sl) { var g = bench.slot(sl); if (g) c = union(c, [g.x - 60, g.y - 60, 120, 120]); });
        scene.state.leads.forEach(function (l) { l.forEach(function (pt) { if (/^t:|^rail:/.test(pt)) { var q = bench.point(pt); if (q) c = union(c, [q[0] - 50, q[1] - 50, 100, 100]); } }); });
        r = c || (scene.state.leads.length ? null : RECT.board);   // leads only to instruments: show the whole bench
      }
      if (f === "scope") r = union(r, RECT.sc);
      (scene.marks || []).forEach(function (m) {
        if (m.p) r = union(r, boxOfPoint(m.p));
        else if (m.s) { var g = bench.slot(m.s); if (g) r = union(r, [g.x - 40, g.y - 40, 80, 80]); }
        else if (m.box) r = union(r, m.box);
      });
      if (!r) r = [0, 0, W, H];
    }
    var pad = scene.view ? 0 : 26; r = [r[0] - pad, r[1] - pad, r[2] + 2 * pad, r[3] + 2 * pad];
    var w = Math.max(r[2], scene.view ? 300 : 820), h = Math.max(r[3], w * PH / PW); w = Math.max(w, h * PW / PH);
    var x = r[0] + r[2] / 2 - w / 2, y = r[1] + r[3] / 2 - h / 2;
    if (w <= W) x = Math.max(0, Math.min(W - w, x)); else x = (W - w) / 2;
    if (h <= H) y = Math.max(0, Math.min(H - h, y)); else y = (H - h) / 2;
    return [x, y, w, h];
  }
  function tableHtml(t) {
    if (!t) return "";
    var n = t.rows.length, hl = -1; t.rows.forEach(function (r, k) { if (r.on) hl = k; });
    var from = 0, to = n, MAX = 11;
    if (n > MAX) { from = Math.max(0, Math.min(n - MAX, (hl < 0 ? 0 : hl) - 5)); to = from + MAX; }
    var ncol = t.head.length, h = '<div class="tb-t">' + esc(t.title) + (n > MAX ? (window.EN ? " · rows " + (from + 1) + "–" + to + " of " + n : " · الصفوف " + (from + 1) + "–" + to + " من " + n) : "") + '</div><table class="tb' + (n > 7 || ncol > 4 ? " small" : "") + '"><tr>' + t.head.map(function (c) { return "<th>" + esc(c) + "</th>"; }).join("") + "</tr>";
    for (var k = from; k < to; k++) {
      var r = t.rows[k], cells = [];
      for (var c = 1; c < ncol; c++) cells.push(r.cells[c - 1] === undefined ? "·" : r.cells[c - 1]);
      h += '<tr class="' + (r.on ? "on" : "") + '"><td class="l">' + esc(r.label) + (r.unit && t.kind !== "pf" && t.kind !== "pair" && r.label.indexOf("(") < 0 ? ' <span style="color:#7f8aa3">(' + esc(r.unit) + ')</span>' : "") + "</td>" + cells.map(function (v) { return '<td class="v">' + esc(v) + "</td>"; }).join("") + "</tr>";
    }
    return h + "</table>";
  }
  window.show = function (scene, meta) {
    document.getElementById("hdr-l").textContent = meta.label || (window.EN ? "Experiment " : "التجربة ") + meta.n;
    document.getElementById("prog").style.width = (meta.progress * 100).toFixed(2) + "%";
    var card = document.getElementById("card");
    if (scene.kind === "card") {
      card.style.display = "block";
      card.querySelector(".eb").textContent = scene.eyebrow; card.querySelector(".ti").textContent = scene.title; card.querySelector(".en").textContent = scene.en || "";
      card.querySelector(".ls").innerHTML = (scene.lines || []).map(function (l) { return "<div>" + esc(l) + "</div>"; }).join("");
      return true;
    }
    card.style.display = "none";
    var key = meta.id + "|" + scene.inst.join(",");
    if (!bench || key !== benchKey) {
      if (bench) bench.destroy();
      try { localStorage.clear(); } catch (e) {}
      var e = CV.clabExps.list.filter(function (x) { return x.id === meta.id; })[0];
      bench = CV.clabBench.mount(document.getElementById("bench"), { key: "video-" + meta.id, inst: scene.inst, kit: e ? e.kit : [] });
      benchKey = key;
    }
    bench.load({ parts: scene.state.parts, leads: scene.state.leads, set: scene.state.inst });
    bench.mark(scene.marks || []);
    var v = viewFor(scene); bench.view(v[0], v[1], v[2], v[3]);
    var p = scene.panel || {}, h = "";
    if (p.title) h += '<div class="t">' + esc(p.title) + "</div>";
    if (p.sub) h += '<div class="sub">' + esc(p.sub) + "</div>";
    if (p.lines && p.lines.length) h += '<div class="ln">' + p.lines.map(function (l) { return "<p>" + esc(l) + "</p>"; }).join("") + "</div>";
    if (p.fig) h += '<div class="fig">' + CV.draw.render(p.fig, { aria: p.title }) + "</div>";
    if (p.steps) h += '<ol class="steps">' + p.steps.map(function (s) { return "<li>" + esc(s) + "</li>"; }).join("") + "</ol>";
    if (p.note) h += '<div class="note">' + esc(p.note) + "</div>";
    if (p.table) h += "<div>" + tableHtml(p.table) + "</div>";
    document.getElementById("side").innerHTML = h;
    if (window.EN) {
      if (CV.bi && CV.bi.apply) CV.bi.apply(document.getElementById("bench"));
      var M = { "وصلة": "Link", "القطع": "Parts", "مقاومة": "Resistor", "صندوق المقاومات": "Resistance box", "صندوق المكثفات": "Capacitance box", "صندوق المحاثة": "Inductance box", "مولد الإشارة": "Signal generator" };
      var w = document.createTreeWalker(document.getElementById("bench"), NodeFilter.SHOW_TEXT), nd, left = [];
      while ((nd = w.nextNode())) { var tx = nd.nodeValue; if (!/[\u0600-\u06ff]/.test(tx)) continue;
        var t2 = tx.replace(/PARTS\s*·\s*القطع/, "PARTS").replace("CAP · متقدم", "CAP · leading").replace("مجس + مشبك أسود", "probe + black clip").replace("IND · متأخر", "IND · lagging").replace("(مع الملف الخانق)", "(with ballast)").replace("POWER METER · عدّاد القدرة", "POWER METER").replace("الخرج بعد العدّاد", "Output after the meter").replace("في Fluke 115 سلك في مدخل التيار (A أو mA) والمفتاح على غير التيار. مدخل التيار مقاومته شبه صفر: لو لمست به جهدًا تعمل قصرًا.", "On the Fluke 115 a wire is in the current input (A or mA) while the switch is not on current. The current input has almost zero resistance: touching a voltage with it makes a short."); Object.keys(M).forEach(function (k) { if (t2.trim() === k) t2 = M[k]; });
        nd.nodeValue = t2; if (/[\u0600-\u06ff]/.test(t2) && nd.parentNode && getComputedStyle(nd.parentNode).display !== "none") left.push(t2); }
      window.benchLeft = left;
    }
    return true;
  };
})();
</script>
